{% extends "base.html" %}

{% block content %}
<h2>Edit Employee</h2>
<form method="POST" action="{{ url_for('edit_employee', emp_id=employee.empId) }}" class="form-container">
    <label for="empId">Employee ID</label>
    <input type="text" name="empId" value="{{ employee.empId }}" readonly>

    <label for="empName">Name</label>
    <input type="text" name="empName" value="{{ employee.empName }}" required>

    <label for="phoneNo">Phone Number</label>
    <input type="text" name="phoneNo" value="{{ employee.phoneNo or '' }}">

    <label for="targetAmount">Target Amount</label>
    <input type="number" name="targetAmount" value="{{ employee.targetAmount }}" required>

    <label for="achievedAmount">Achieved Amount</label>
    <input type="number" name="achievedAmount" value="{{ employee.achievedAmount }}" required>

    <button type="submit" class="btn">Update</button>
    <a href="{{ url_for('employees') }}" class="btn danger">Cancel</a>
</form>
{% endblock %}
