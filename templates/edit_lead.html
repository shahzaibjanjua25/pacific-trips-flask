{% extends "base.html" %}

{% block content %}
<h2>Add New Lead</h2>

<form method="post">
    <label for="employeeId">Employee:</label>
    <select name="employeeId" required>
        {% for emp in employees %}
        <option value="{{ emp.empId }}">{{ emp.empName }} ({{ emp.phoneNo }})</option>
        {% endfor %}
    </select>

    <label for="customerId">Customer:</label>
    <select name="customerId" required>
        {% for cust in customers %}
        <option value="{{ cust.customerId }}">{{ cust.customerName }} ({{ cust.phoneNo }})</option>
        {% endfor %}
    </select>

    <label for="status">Status:</label>
    <select name="status" required>
        <option value="New">New</option>
        <option value="In Progress">In Progress</option>
        <option value="Converted">Converted</option>
        <option value="Lost">Lost</option>
    </select>

    <label for="source">Source:</label>
    <input type="text" name="source" placeholder="e.g. Facebook, Google Ads" required>

    <label for="currentAddress">Current Address:</label>
    <input type="text" name="currentAddress" required>

    <label for="desiredDestination">Destination:</label>
    <input type="text" name="desiredDestination" required>

    <label for="dateSource">Source Date:</label>
    <input type="date" name="dateSource">

    <button type="submit">Create Lead</button>
    <a href="{{ url_for('leads') }}" class="btn">🔙 Back to Leads</a>
</form>
{% endblock %}
