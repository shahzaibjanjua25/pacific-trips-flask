{% extends "base.html" %}

{% block content %}
<h2>Edit Lead</h2>

<form method="POST" id="leadForm">
    <label for="employeeId">Employee:</label>
    <select name="employeeId" required>
        {% for emp in employees %}
        <option value="{{ emp.empId }}" {% if emp.empId==lead.employeeId %}selected{% endif %}>
            {{ emp.empName }}
        </option>
        {% endfor %}
    </select><br><br>

    <label for="customerId">Customer:</label>
    <select name="customerId" required>
        {% for cust in customers %}
        <option value="{{ cust.customerId }}" {% if cust.customerId==lead.customerId %}selected{% endif %}>
            {{ cust.customerName }}
        </option>
        {% endfor %}
    </select><br><br>

    <label for="status">Status:</label>
    <select name="status" id="status" required onchange="checkStatusChange()">
        {% for s in ['Pending', 'Contacted', 'Lost', 'Willing', 'Paid', 'Refund', 'Confirmed'] %}
        <option value="{{ s }}" {% if s==lead.status %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
    </select><br><br>

    <label for="source">Source:</label>
    <select name="source" required>
        {% for s in ['Facebook', 'WhatsApp', 'Reference', 'TikTok', 'Other'] %}
        <option value="{{ s }}" {% if s==lead.source %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
    </select><br><br>

    <label for="currentAddress">Current Address:</label>
    <input type="text" name="currentAddress" value="{{ lead.currentAddress }}" required><br><br>

    <label for="desiredDestination">Desired Destination:</label>
    <input type="text" name="desiredDestination" value="{{ lead.desiredDestination }}" required><br><br>

    <!-- Hidden field for amount -->
    <input type="hidden" id="amountClosed" name="amountClosed" value="{{ lead.amountClosed or 0 }}">

    <button type="submit">Update Lead</button>
    <a href="{{ url_for('leads') }}">Cancel</a>
</form>

<!-- Amount Input Modal -->
<div id="amountModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Enter Amount</h3>
        <input type="number" id="amountInput" placeholder="Enter amount">
        <button id="confirmAmount" onclick="confirmAmount()">Confirm</button>
    </div>
</div>

<script>
let previousStatus = "{{ lead.status }}";

function checkStatusChange() {
    const newStatus = document.getElementById('status').value;
    
    if (newStatus === 'Confirmed' && previousStatus !== 'Confirmed') {
        showAmountModal('Enter the closed amount for this lead:');
    } 
    
    previousStatus = newStatus;
}

function showAmountModal(message) {
    document.getElementById('modalTitle').textContent = message;
    document.getElementById('amountInput').value = '';
    document.getElementById('amountModal').style.display = 'block';
}

function closeModal() {
    document.getElementById('amountModal').style.display = 'none';
}

function confirmAmount() {
    const amount = document.getElementById('amountInput').value;
    if (amount && !isNaN(amount)) {
        document.getElementById('amountClosed').value = amount;
        closeModal();
    } else {
        alert('Please enter a valid amount');
    }
}

window.onclick = function(event) {
    const modal = document.getElementById('amountModal');
    if (event.target == modal) {
        closeModal();
    }
}
</script>

<style>
.modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
}

.modal-content {
    background-color: #fefefe;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 500px;
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover {
    color: black;
}
</style>
{% endblock %}
