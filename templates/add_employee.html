{% extends "base.html" %}

{% block content %}
<h2>Add Employee</h2>

<form method="POST" action="{{ url_for('add_employee') }}">
    <div>
        <label for="empName">Name</label>
        <input type="text" name="empName" id="empName" required>
    </div>

    <div>
        <label for="phoneNo">Phone Number</label>
        <input type="text" name="phoneNo" id="phoneNo">
    </div>

    <div>
        <label for="targetAmount">Target Amount</label>
        <input type="number" name="targetAmount" id="targetAmount" required>
    </div>

    <div>
        <label for="achievedAmount">Achieved Amount</label>
        <input type="number" name="achievedAmount" id="achievedAmount" required>
    </div>

    <!-- Placeholder div for grid alignment -->
    <div></div>

    <div class="form-buttons">
        <button type="submit" class="btn">Add Employee</button>
        <a href="{{ url_for('employees') }}" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
