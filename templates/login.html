<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta & Title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional Custom Styles -->
    <style>
       /* Body background and base styling */
body {
    background: #f8f9fa;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
}

/* Login container styling */
.login-container {
    max-width: 420px;
    margin: 80px auto;
    padding: 30px 35px;
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    /*  */
}

/* Title (if used separately) */
.login-title {
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 25px;
    color: #343a40;
}

/* Logo image styling */
.logo2 {
    width: 100px;
    margin-bottom: 10px;
    transition: transform 0.3s ease-in-out;
}

.logo2:hover {
    transform: scale(1.05);
}

/* Subtitle text under the logo */
.login-container p {
    font-weight: 500;
    color: #555;
    font-size: 0.95rem;
}

/* Input field focus styling */
.form-control:focus {
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    border-color: #86b7fe;
}

/* Alert message styling */
.alert {
    font-size: 0.95rem;
    padding: 0.75rem 1rem;
    margin-bottom: 15px;
    text-align: left;
}

/* Link buttons (register, forgot password) */
.btn-link {
    font-size: 0.9rem;
    text-decoration: none;
    padding: 0;
}

.btn-link:hover {
    text-decoration: underline;
}
.form-label {
    font-weight: 500;
    font-size: 0.95rem;
    color: #495057;
    margin-bottom: 6px;
    display: inline-block;
    transition: color 0.2s ease-in-out;
}

.form-label:hover {
    color: #0d6efd; /* Primary Bootstrap blue on hover */
}

/* Optional footer-style links */
.footer-link {
    font-size: 0.85rem;
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #6c757d;
}

.footer-link:hover {
    text-decoration: underline;
}

/* Login button grid gap */
.d-grid.gap-2 .btn {
    padding: 10px;
    font-size: 1rem;
    font-weight: 500;
}

/* Responsive tweaks */
@media (max-width: 576px) {
    .login-container {
        margin: 40px 15px;
        padding: 25px 20px;
    }

    .logo2 {
        width: 80px;
    }

    .login-container p {
        font-size: 0.85rem;
    }
}

    </style>
</head>

<body>
    <div class="container">
        <div class="login-container">
            <!-- Logo & Heading -->
            <div class="mb-4" style="text-align: center;">
                <img src="{{ url_for('static', filename='logo2.png') }}" class="logo2 mb-2" alt="EMS Logo"
                    style="width: 100px; ">
                    <br>
                <strong class="fw-medium mb-0">Pacific Trips Employee Management System</strong>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="employeeId" class="form-label">Employee ID</label>
                    <input type="text" class="form-control" id="employeeId" name="employeeId" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>

                <!-- Extra Links -->
                <div class="text-center">
                    <a href="{{ url_for('register') }}" class="btn btn-link">Don't have an account? Register</a>
                </div>
            </form>
    </div>
    </div>

    <!-- Bootstrap JS Bundle (for dismissible alerts) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
