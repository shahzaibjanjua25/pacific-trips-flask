{% extends "base.html" %}

{% block content %}
    <h2>Edit Customer</h2>
    <form method="POST">
        <div class="form-group">
            <label for="customerId">Customer ID:</label>
            <input type="text" id="customerId" name="customerId" value="{{ customer.customerId }}" readonly>
        </div>

        <div class="form-group">
            <label for="customerName">Name:</label>
            <input type="text" id="customerName" name="customerName" value="{{ customer.customerName }}" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" value="{{ customer.phone }}" required>
        </div>

        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" name="status" required>
                {% for s in ['Pending', 'Contacted', 'Lost', 'Willing', 'Paid', 'Refund', 'Confirmed'] %}
                <option value="{{ s }}" {% if customer.status == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="source">Source:</label>
            <select id="source" name="source" required>
                {% for s in ['Facebook', 'WhatsApp', 'Reference', 'TikTok', 'Other'] %}
                <option value="{{ s }}" {% if customer.source == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="currentLocation">Current Location:</label>
            <input type="text" id="currentLocation" name="currentLocation" value="{{ customer.currentLocation }}" required>
        </div>

        <div class="form-group">
            <label for="desiredDestination">Desired Destination:</label>
            <input type="text" id="desiredDestination" name="desiredDestination" value="{{ customer.desiredDestination }}" required>
        </div>

        <div class="form-group">
            <label for="dateOfArrival">Date of Arrival:</label>
            <input type="date" id="dateOfArrival" name="dateOfArrival" value="{{ customer.dateOfArrival or '' }}">
        </div>

        <div class="form-group">
            <button type="submit" class="btn btn-edit">Update Customer</button>
            <a href="{{ url_for('customers') }}" class="btn btn-clear">Cancel</a>
        </div>
    </form>
{% endblock %}
