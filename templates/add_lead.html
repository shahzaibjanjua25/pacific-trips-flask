{% extends "base.html" %}

{% block content %}
<h2>Add New Lead</h2>

<form method="POST">
    <label for="employeeId">Employee:</label>
    <select name="employeeId" required>
        {% for emp in employees %}
        <option value="{{ emp.empId }}">{{ emp.empName }}</option>
        {% endfor %}
    </select><br><br>

    <label for="customerId">Customer:</label>
    <select name="customerId" required>
        {% for cust in customers %}
        <option value="{{ cust.customerId }}">{{ cust.customerName }}</option>
        {% endfor %}
    </select><br><br>

    <label for="status">Status:</label>
    <select name="status" required>
        {% for s in ['Pending', 'Contacted', 'Lost', 'Willing', 'Paid', 'Refund', 'Confirmed'] %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
    </select><br><br>

    <label for="source">Source:</label>
    <select name="source" required>
        {% for s in ['Facebook', 'WhatsApp', 'Reference', 'TikTok', 'Other'] %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
    </select><br><br>


    <label for="currentAddress">Current Address:</label>
    <input type="text" name="currentAddress" required><br><br>

    <label for="desiredDestination">Desired Destination:</label>
    <input type="text" name="desiredDestination" required><br><br>

    <label for="dateSource">Date Source:</label>
    <input type="date" name="dateSource"><br><br>

    <button type="submit">Create Lead</button>
    <a href="{{ url_for('leads') }}">Cancel</a>
</form>
{% endblock %}
