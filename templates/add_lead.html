{% extends "base.html" %}

{% block content %}
<h2>Add New Lead</h2>

<form method="POST" id="leadForm">
    <label for="employeeId">Employee:</label>
    <select name="employeeId" id="employeeId" required>
        {% for emp in employees %}
        <option value="{{ emp.empId }}">{{ emp.empName }}</option>
        {% endfor %}
    </select><br><br>

    <label for="customerId">Customer:</label>
    <select name="customerId" id="customerId" required onchange="updateCustomerDetails()">
        <option value="">Select a customer</option>
        {% for cust in customers %}
        <option value="{{ cust.customerId }}" 
                data-current="{{ cust.currentLocation }}" 
                data-destination="{{ cust.desiredDestination }}"
                data-phone="{{ cust.phone }}"
                data-source="{{ cust.source }}">
            {{ cust.customerName }}
        </option>
        {% endfor %}
    </select><br><br>

    <label for="status">Status:</label>
    <select name="status" id="status" required onchange="checkStatusChange()">
        {% for s in ['Pending', 'Contacted', 'Lost', 'Willing', 'Paid', 'Refund', 'Confirmed'] %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
    </select><br><br>

    <!-- Hidden fields auto-filled from customer -->
    <input type="hidden" name="source" id="source">
    <input type="hidden" name="currentAddress" id="currentAddress">
    <input type="hidden" name="desiredDestination" id="desiredDestination">

    <!-- Hidden field for amount -->
    <input type="hidden" id="amountClosed" name="amountClosed" value="0">

    <button type="submit">Create Lead</button>
    <a href="{{ url_for('leads') }}">Cancel</a>
</form>

<!-- Amount Input Modal -->
<div id="amountModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Enter Amount</h3>
        <input type="number" id="amountInput" placeholder="Enter amount">
        <button id="confirmAmount" onclick="confirmAmount()">Confirm</button>
    </div>
</div>

<script>
function updateCustomerDetails() {
    const customerSelect = document.getElementById('customerId');
    const selectedOption = customerSelect.options[customerSelect.selectedIndex];
    
    if (selectedOption.value) {
        document.getElementById('currentAddress').value = selectedOption.dataset.current;
        document.getElementById('desiredDestination').value = selectedOption.dataset.destination;
        document.getElementById('source').value = selectedOption.dataset.source;
    } else {
        document.getElementById('currentAddress').value = '';
        document.getElementById('desiredDestination').value = '';
        document.getElementById('source').value = '';
    }
}

let previousStatus = '';

function checkStatusChange() {
    const newStatus = document.getElementById('status').value;
    
    if (newStatus === 'Confirmed') {
        showAmountModal('Enter the closed amount for this lead:');
    }
    
    previousStatus = newStatus;
}

function showAmountModal(message) {
    document.getElementById('modalTitle').textContent = message;
    document.getElementById('amountInput').value = '';
    document.getElementById('amountModal').style.display = 'block';
}

function closeModal() {
    document.getElementById('amountModal').style.display = 'none';
}

function confirmAmount() {
    const amount = document.getElementById('amountInput').value;
    if (amount && !isNaN(amount)) {
        document.getElementById('amountClosed').value = amount;
        closeModal();
    } else {
        alert('Please enter a valid amount');
    }
}

window.onclick = function(event) {
    const modal = document.getElementById('amountModal');
    if (event.target == modal) {
        closeModal();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    updateCustomerDetails();
});
</script>

<style>
.modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
}

.modal-content {
    background-color: #fefefe;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 500px;
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover {
    color: black;
}
</style>
{% endblock %}
