<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .register-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 30px 35px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .register-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            color: #343a40;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.95rem;
            color: #495057;
            margin-bottom: 6px;
            display: inline-block;
            transition: color 0.2s ease-in-out;
        }

        .form-label:hover {
            color: #0d6efd;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
            border-color: #86b7fe;
        }

        .alert {
            font-size: 0.95rem;
            padding: 0.75rem 1rem;
            margin-bottom: 15px;
        }

        .btn-link {
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .register-container {
                margin: 40px 15px;
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container">
            <!-- Title -->
            <div class="mb-4" style="text-align: center;">
                <img src="{{ url_for('static', filename='logo2.png') }}" class="logo2 mb-2" alt="EMS Logo" style="width: 100px;" />
                <br />
                <strong class="fw-medium mb-0">Pacific Trips Employee Management System</strong>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Register Form -->
            <form method="POST" action="{{ url_for('register') }}" id="registerForm" novalidate>
                <div class="mb-3">
                    <label for="employeeId" class="form-label">Employee ID</label>
                    <input type="text" class="form-control" id="employeeId" name="employeeId" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required />
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required />
                </div>
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary">Register</button>
                </div>

                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="btn btn-link">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const form = document.getElementById('registerForm');
        form.addEventListener('submit', function (e) {
            const password = form.password.value;
            const confirmPassword = form.confirmPassword.value;

            if (password !== confirmPassword) {
                e.preventDefault(); // prevent form submission
                alert('Passwords do not match. Please try again.');
                form.confirmPassword.focus();
            }
        });
    </script>
</body>
</html>
